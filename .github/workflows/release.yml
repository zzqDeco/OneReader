name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Prepare pinned XcodeGen
        shell: bash
        run: |
          xcodegen_bin="$(scripts/install-xcodegen.sh "$RUNNER_TEMP")"
          "$xcodegen_bin/xcodegen" --version
          echo "$xcodegen_bin" >> "$GITHUB_PATH"

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main --tags
          RELEASE_TAG="$GITHUB_REF_NAME" scripts/validate-release-ref.sh

      - name: Run authoritative native validation
        run: scripts/validate-native.sh

      - name: Build DMG, ZIP, checksums, and manifest
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            export RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            export RELEASE_TAG="dry-run-${GITHUB_SHA}"
          fi
          scripts/package-release.sh

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OneReader-release-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/OneReader-v*-macos-developer-preview.dmg
            dist/OneReader-v*-macos-developer-preview.dmg.sha256
            dist/OneReader-v*-macos-developer-preview.zip
            dist/OneReader-v*-macos-developer-preview.zip.sha256
            dist/release-manifest.json
            dist/release-manifest.json.sha256

  publish:
    name: Publish prerelease
    if: github.event_name == 'push'
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: OneReader-release-${{ github.run_id }}
          path: dist

      - name: Verify artifact checksums
        run: |
          cd dist
          shasum -a 256 -c OneReader-v*-macos-developer-preview.dmg.sha256
          shasum -a 256 -c OneReader-v*-macos-developer-preview.zip.sha256
          shasum -a 256 -c release-manifest.json.sha256

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/OneReader-v*-macos-developer-preview.dmg \
            dist/OneReader-v*-macos-developer-preview.dmg.sha256 \
            dist/OneReader-v*-macos-developer-preview.zip \
            dist/OneReader-v*-macos-developer-preview.zip.sha256 \
            dist/release-manifest.json \
            dist/release-manifest.json.sha256 \
            --title "OneReader ${GITHUB_REF_NAME} Developer Preview" \
            --target "$(git rev-list -n 1 "$GITHUB_REF_NAME")" \
            --prerelease \
            --latest=false \
            --notes "Ad-hoc signed, sandboxed developer preview. Developer ID signing and notarization are not included in this release."
