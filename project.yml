name: OneReader

options:
  bundleIdPrefix: io.github.zzqDeco
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.1"
  minimumXcodeGenVersion: 2.45.3
  xcodeVersion: "26.6"

packages:
  OneReaderPackage:
    path: .

settings:
  base:
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 0.3.3
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0
    ONEREADER_IOS_BUNDLE_IDENTIFIER: io.github.zzqDeco.OneReader
    ONEREADER_IOS_DISPLAY_NAME: OneReader
    ONEREADER_IOS_PUBLIC_PDF_TEST: "NO"
    ONEREADER_CAPTURE_APP_GROUP: group.io.github.zzqDeco.OneReader.capture

targets:
  OneReader-macOS:
    type: application
    platform: macOS
    deploymentTarget: "26.1"
    sources:
      - path: Apps/OneReaderApp
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: OneReaderPackage
        product: OneReader
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: OneReader
        CFBundleURLTypes:
          - CFBundleURLName: io.github.zzqDeco.OneReader.notes
            CFBundleURLSchemes:
              - onereader
        CFBundleDocumentTypes:
          - CFBundleTypeName: Readable material
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - org.idpf.epub-container
              - net.daringfireball.markdown
              - public.plain-text
              - public.html
              - public.source-code
              - public.data
              - public.folder
              - public.directory
        CFBundleExecutable: OneReader
        CFBundleIconFile: AppIcon
        CFBundleIdentifier: io.github.zzqDeco.OneReader
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: OneReader
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.3.3"
        CFBundleVersion: "6"
        LSMinimumSystemVersion: "26.1"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/OneReader.entitlements
        ENABLE_APP_SANDBOX: true
        ENABLE_HARDENED_RUNTIME: true
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zzqDeco.OneReader
        PRODUCT_MODULE_NAME: OneReaderMacApp
        PRODUCT_NAME: OneReader

  OneReader-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: Apps/OneReaderApp
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: OneReaderPackage
        product: OneReader
      - target: OneReader-Share
        embed: true
    info:
      path: Resources/Info-iOS.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        OneReaderCaptureAppGroup: $(ONEREADER_CAPTURE_APP_GROUP)
        CFBundleDisplayName: $(ONEREADER_IOS_DISPLAY_NAME)
        CFBundleURLTypes:
          - CFBundleURLName: io.github.zzqDeco.OneReader.notes
            CFBundleURLSchemes:
              - onereader
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Readable material
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - org.idpf.epub-container
              - net.daringfireball.markdown
              - public.plain-text
              - public.html
              - public.source-code
              - public.data
        CFBundleExecutable: OneReader
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: OneReader
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.3.3"
        CFBundleVersion: "6"
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: OneReader 仅在你配置 Ollama 等本地模型服务时访问局域网端点。
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/OneReader-iOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(ONEREADER_IOS_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: OneReaderMobileApp
        PRODUCT_NAME: OneReader
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"

  OneReader-Share:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: Apps/OneReaderShareExtension
      - path: Sources/OneReader/Domain/CaptureModels.swift
      - path: Sources/OneReader/Persistence/CaptureStagingStore.swift
    info:
      path: Resources/Info-Share.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        OneReaderCaptureAppGroup: $(ONEREADER_CAPTURE_APP_GROUP)
        CFBundleDisplayName: OneReader
        CFBundleShortVersionString: "0.3.3"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ONEREADER_IOS_BUNDLE_IDENTIFIER).Share
        PRODUCT_MODULE_NAME: OneReaderShare
        CODE_SIGN_ENTITLEMENTS: Resources/OneReader-Share.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"

  OneReader-iOSLayoutTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: Tests/OneReaderiOSTests
    dependencies:
      - target: OneReader-iOS
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zzqDeco.OneReader.LayoutTests
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OneReader.app/OneReader"

  OneReader-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: Tests/OneReaderiOSUITests
    dependencies:
      - target: OneReader-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zzqDeco.OneReader.UITests
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  OneReader-macOS:
    build:
      targets:
        OneReader-macOS: all
    run:
      config: Debug
    archive:
      config: Release

  OneReader-iOS:
    build:
      targets:
        OneReader-iOS: all
        OneReader-iOSLayoutTests: [test]
        OneReader-iOSUITests: [test]
    test:
      config: Debug
      environmentVariables:
        ONEREADER_IOS_PUBLIC_PDF_TEST: "$(ONEREADER_IOS_PUBLIC_PDF_TEST)"
      targets:
        - OneReader-iOSLayoutTests
        - OneReader-iOSUITests
    run:
      config: Debug
    archive:
      config: Release
